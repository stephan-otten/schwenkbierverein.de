<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schwenkbierverein</title>
<meta name="description" content="Die Website des Schwenkbiervereins entsteht gerade.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=Manrope:wght@400;600&display=swap">
<style>
  :root {
    --bg: #1f1611;
    --bg-2: #2c1f16;
    --fg: #f4e9d8;
    --muted: #c9b79c;
    --amber: #d99a2b;
    --amber-2: #f2c26b;
    --font-display: "Fraunces", "Iowan Old Style", Georgia, serif;
    --font-body: "Manrope", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(ellipse at 50% 0%, var(--bg-2), var(--bg) 70%);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.55;
    display: grid;
    place-items: center;
    padding-block: 48px;
    padding-inline: 20px;
  }
  main { max-width: 620px; width: 100%; text-align: center; }
  .mark {
    width: 72px; height: 72px; margin: 0 auto 28px; border-radius: 50%;
    border: 2px solid var(--amber); display: grid; place-items: center;
    font-family: var(--font-display); font-weight: 600; font-size: 34px; color: var(--amber-2);
  }
  h1 {
    font-family: var(--font-display); font-weight: 300; font-optical-sizing: auto;
    font-size: clamp(40px, 8vw, 68px); line-height: 1.02; letter-spacing: -0.015em;
    margin: 0 0 18px; text-wrap: balance;
  }
  p { margin: 0 0 14px; color: var(--muted); text-wrap: pretty; }
  .eyebrow { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--amber); margin-bottom: 22px; }
  a { color: var(--amber-2); text-decoration: none; border-bottom: 1px solid rgba(242,194,107,0.35); }
  a:hover, a:focus-visible { border-bottom-color: var(--amber-2); outline: none; }
  .contact { margin-top: 36px; font-size: 15px; }
  footer { margin-top: 56px; font-size: 13px; color: rgba(201,183,156,0.6); }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">S</div>
  <div class="eyebrow">schwenkbierverein.de</div>
  <h1>Schwenkbierverein</h1>
  <p>Diese Seite entsteht gerade. In Kürze findet ihr hier alles rund um den Verein, Termine und Kontakt.</p>
  <p class="contact">Fragen an den Vorstand: <a href="mailto:vorstand@schwenkbierverein.de">vorstand@schwenkbierverein.de</a></p>
  <footer>Stand: September 2026</footer>
</main>
</body>
</html>
